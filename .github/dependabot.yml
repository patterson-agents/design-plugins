# Dependabot configuration — keeps the repo's real dependency surface current.
# The marketplace itself ships no runtime deps; the only npm manifests are the
# runnable docs-site starters under plugins/patterson-{starlight,vitepress}/ds/.
version: 2
updates:
  # --- Starlight starter ---
  # Pins are exact and the committed bun.lock is the install-verified tree, so
  # a bump here is a deliberate re-verification, not a range widening.
  - package-ecosystem: "npm"
    directory: "/plugins/patterson-starlight/ds/templates/starlight"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    groups:
      starlight-template:
        patterns: ["*"]

  # --- VitePress starter ---
  # Held on the `next` line: vitepress 2.0.0-alpha.19 is the newest release,
  # and `latest` (1.6.4) would be a downgrade. Suppress the major-version
  # "update" that would propose exactly that.
  - package-ecosystem: "npm"
    directory: "/plugins/patterson-vitepress/ds/templates/vitepress"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    groups:
      vitepress-template:
        patterns: ["*"]
    ignore:
      - dependency-name: "vitepress"
        update-types: ["version-update:semver-major"]

  # --- GitHub Actions used by the CI workflows (clean, always-mergeable) ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      ci-actions:
        patterns: ["*"]
